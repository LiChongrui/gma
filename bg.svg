<svg
  version="1.1"
  baseProfile="full"
  width="100%" height="100%"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 800"
>

  <!-- 背景渐变圆形（新增中心发光元素） -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4954e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="700" cy="400" r="300" fill="url(#glow)">
    <animate attributeName="r" values="300;350;300" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- 环绕轨道上的金色圆点（替代原黄色弧形） -->
  <circle cx="700" cy="150" r="15" stroke="#fcd34d" fill="#fcd34d">
    <animateMotion path="M 0 0 C 100 -100 200 -100 300 0 C 400 100 400 200 300 300 C 200 400 100 400 0 300 C -100 200 -100 100 0 0" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- 逆时针旋转的粉色三角形（替代原三角形，位置调整） -->
  <path d="M 165 580 L 270 580 Q275 578 270 570 L 223 483 Q220 480 217 483 L 165 570 Q160 578 165 580" stroke="#f472b6" fill="#f472b6">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="20s" type="rotate" from="0 700 400" to="-360 700 400" repeatCount="indefinite" />
  </path>

  <!-- 左上角浮动的小方块（替代原小圆点，增加趣味） -->
  <rect x="180" y="120" width="30" height="30" rx="5" stroke="#a78bfa" fill="#a78bfa">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="5s" type="translate" values="0,0; 40,20; 0,0" repeatCount="indefinite" />
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="5s" type="rotate" values="0;360" repeatCount="indefinite" additive="sum"/>
  </rect>

  <!-- 右下角发光圆点（替代原白色圆点） -->
  <circle cx="1200" cy="600" r="25" stroke="#fcd34d" fill="#fcd34d" opacity="0.8">
    <animateMotion path="M 0 0 L -30 20 Z" dur="7s" repeatCount="indefinite" />
    <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- 新增：悬浮的细小粒子群（营造星空感） -->
  <circle cx="200" cy="650" r="6" stroke="#c4b5fd" fill="#c4b5fd">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="8s" type="translate" values="0,0; 50,-30; 0,0" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="200" r="4" stroke="#fcd34d" fill="#fcd34d">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="10s" type="translate" values="0,0; -40,60; 0,0" repeatCount="indefinite" />
  </circle>
  <circle cx="300" cy="200" r="5" stroke="#a78bfa" fill="#a78bfa">
    <animateTransform attributeType="XML" attributeName="transform" begin="0s" dur="12s" type="translate" values="0,0; 30,80; 0,0" repeatCount="indefinite" />
  </circle>

</svg>