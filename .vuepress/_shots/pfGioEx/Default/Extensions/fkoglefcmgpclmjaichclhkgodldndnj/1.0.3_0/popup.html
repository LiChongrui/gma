<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>PDF编辑转换器</title>
    <link rel="stylesheet" href="assets/css/popup.css">
</head>

<body>
    <div class="menu_item" id="switch">
        <img src="assets/img/popup_switch.png" class="menu_icon" />
        <span>转换工具悬浮球</span>
        <div class="float-switch">
            <div class="switch-container" id="floatMenuSwitch">
                <div class="switch-handle"></div>
            </div>
        </div>
    </div>
    <div class="menu_item" id="edit">
        <img src="assets/img/popup_edit.png" class="menu_icon" />
        <span>PDF编辑</span>
    </div>
    <div class="menu_item" id="print">
        <img src="assets/img/popup_print.png" class="menu_icon" />
        <span>PDF打印</span>
    </div>
    <div class="menu_item" id="pdf2word">
        <img src="assets/img/popup_pdf2word.png" class="menu_icon" />
        <span>PDF转换为Word</span>
    </div>
    <div class="menu_item" id="pdf2other">
        <img src="assets/img/popup_pdf2other.png" class="menu_icon" />
        <span>PDF转换为其他格式</span>
    </div>
    <div class="menu_item" id="merge_split_compress">
        <img src="assets/img/popup_merge_splite.png" class="menu_icon" />
        <span>PDF合并/拆分/压缩</span>
    </div>
    <div class="menu_item" id="more">
        <img src="assets/img/popup_more.png" class="menu_icon" />
        <span>更多功能</span>
    </div>
    <script src="assets/js/jquery-3.4.1.min.js"></script>
    <script src="assets/js/popup.js"></script>
</body>

</html>
